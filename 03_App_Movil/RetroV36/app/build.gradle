plugins {
    id 'com.android.application'
}

// Misma cadena de compilacion que RetroDiagBT: Gradle 6.5 + AGP 4.1.1 + JDK 11.
android {
    compileSdkVersion 30
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId "com.dpi.retrov36"
        minSdkVersion 24
        targetSdkVersion 30
        // RTV 1.0.0-rc12, versionCode 10012 (A4b, revisión 2: Ops.Restauracion, cotejarHeredados,
        // motivoMascara, protocoloIncumplido y remedida() cerrados con Fabrica.elCodigo/resumen).
        // rc1 = 10000/"1.0.0" (072331f); rc2 = 10001; rc3 = 10002; rc4 = 10003; rc5 = 10004; rc6 = 10005;
        // rc7 = 10006; rc8 = 10007; rc9 = 10008; rc10 = 10009; rc11 = 10010. Cada rc lleva su propio par
        // para que no se confundan en el telefono (RF-APP-41).
        versionCode 10012
        versionName "1.0.0-rc12"
        // Valores por defecto de la app de campo. El APK corto los cambia en el buildType "coviandina".
        buildConfigField "boolean", "CORTO", "false"
        manifestPlaceholders = [etiqueta: "RTV"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        /**
         * APK corto "RTV Calibra" (05_Documentacion/SPEC-App-Calibracion-Coviandina.md §5).
         *
         * applicationId propio: las dos apps caben a la vez en el telefono. Hasta la rc5 eran la misma
         * aplicacion, asi que instalar una borraba la otra y volver atras exigia desinstalar, que se lleva
         * la campana por delante (Campanas guarda en ctx.getFilesDir(), Campanas.java:66). La noche del
         * 19-sep eso obligo a repartir el trabajo entre dos moviles.
         *
         * Nada mas hace falta: el FileProvider ya declara "${applicationId}.ficheros"
         * (AndroidManifest.xml:48), asi que su autoridad se separa sola — dos apps con la misma autoridad
         * no podrian instalarse juntas — y ningun fuente Java escribe el nombre del paquete como literal.
         */
        coviandina {
            initWith debug
            signingConfig signingConfigs.debug
            applicationIdSuffix ".calibra"
            buildConfigField "boolean", "CORTO", "true"
            // versionNameOverride (abajo) solo cambia el manifiesto; lo que la app imprime en pantalla, en
            // el acta y en el registro sale de BuildConfig.VERSION_NAME, y se fija aqui al mismo valor.
            buildConfigField "String", "VERSION_NAME", "\"Cov_3.6.7_calibrar\""
            manifestPlaceholders = [etiqueta: "RTV Calibra"]
            matchingFallbacks = ['debug']
        }
    }

    // El APK de calibrar lleva el nombre que fijo Diego el 21-sep-2026: "Cov_3.6.7_calibrar" (RF-COV-16:
    // versionCode propio, distinto del de cualquier APK anterior del mismo paquete; comparte el par 10012
    // con la app de campo, que es OTRO paquete). Un buildType no puede fijar versionName por si mismo, asi
    // que se sobreescribe en la salida de la variante (AGP 4.1.1: versionNameOverride).
    applicationVariants.all { variant ->
        if (variant.buildType.name == "coviandina") {
            variant.outputs.all { output ->
                output.versionNameOverride = "Cov_3.6.7_calibrar"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // appcompat trae androidx.core, que aporta FileProvider.
    implementation 'androidx.appcompat:appcompat:1.2.0'
    // Tests JVM de la parte de calculo (Inversion, Ajuste, Coherencia, Tramas).
    testImplementation 'junit:junit:4.13.2'
}
