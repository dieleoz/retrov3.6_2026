plugins {
    id 'com.android.application'
}

// Misma cadena de compilacion que RetroDiagBT: Gradle 6.5 + AGP 4.1.1 + JDK 11.
android {
    compileSdkVersion 30
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId "com.dpi.retrov36"
        minSdkVersion 24
        targetSdkVersion 30
        // RTV 1.0.0-rc3. rc1 = 10000/"1.0.0" (072331f, anterior a la mezcla de la 3.6.17); rc2 = 10001.
        // Cada rc lleva su propio par para que no se confundan en el telefono (RF-APP-41).
        versionCode 10002
        versionName "1.0.0-rc3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // appcompat trae androidx.core, que aporta FileProvider.
    implementation 'androidx.appcompat:appcompat:1.2.0'
    // Tests JVM de la parte de calculo (Inversion, Ajuste, Coherencia, Tramas).
    testImplementation 'junit:junit:4.13.2'
}
